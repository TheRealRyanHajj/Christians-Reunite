<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1210" />
  <title>Admin | Christians Reunite</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="site.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><i data-lucide="cross"></i></span>
      <span>Christians Reunite</span>
    </a>
    <a class="button secondary" href="index.html"><i data-lucide="arrow-left"></i> Site</a>
  </header>

  <main class="section">
    <div class="wrap">
      <div class="admin-head">
        <div>
          <p class="kicker">Admin</p>
          <h1 class="page-title">Prayer requests</h1>
          <p class="lead">Sign in with an allowed Google account.</p>
        </div>
        <div class="actions">
          <button id="loginBtn" class="button primary" type="button"><i data-lucide="log-in"></i> Google Sign In</button>
          <button id="logoutBtn" class="button secondary" type="button" hidden><i data-lucide="log-out"></i> Sign Out</button>
        </div>
      </div>

      <p id="adminNotice" class="notice"></p>

      <section id="adminPanel" class="panel" hidden>
        <div class="toolbar">
          <strong id="adminCount">0 requests</strong>
          <button id="refreshAdmin" class="button secondary" type="button"><i data-lucide="refresh-cw"></i> Refresh</button>
        </div>
        <div id="adminList" class="list"></div>
      </section>
    </div>
  </main>
</body>
</html>
