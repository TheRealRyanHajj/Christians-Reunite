<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2032" />
  <title>Admin | Christians Reunite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="site.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="assets/favicon.svg" alt="" /></span>
      <span>Christians Reunite</span>
    </a>
    <a class="button secondary" href="index.html"><i data-lucide="arrow-left"></i> Site</a>
  </header>

  <main class="section">
    <div class="wrap">
      <div class="admin-head">
        <div>
          <p class="kicker">Admin</p>
          <h1 class="page-title">Prayer requests</h1>
          <p class="lead">Sign in with an allowed Google account.</p>
        </div>
        <div class="actions admin-login">
          <div id="googleSignIn"></div>
          <button id="logoutBtn" class="button secondary" type="button" hidden><i data-lucide="log-out"></i> Sign Out</button>
        </div>
      </div>

      <p id="adminNotice" class="notice"></p>

      <section id="adminPanel" class="panel" hidden>
        <div class="admin-controls">
          <label class="field search-field">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Name, phone, category, or prayer text" />
          </label>
          <label class="field">
            <span>Status</span>
            <select id="statusFilter">
              <option value="active">Active</option>
              <option value="new">New</option>
              <option value="prayed">Prayed</option>
              <option value="archived">Archived</option>
              <option value="all">All</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="priorityFilter">
              <option value="all">All</option>
              <option value="urgent">Urgent</option>
              <option value="contact">Contact</option>
              <option value="wall">Wall OK</option>
              <option value="private">Private</option>
            </select>
          </label>
          <label class="field">
            <span>Sort</span>
            <select id="sortSelect">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="urgent">Urgent first</option>
            </select>
          </label>
        </div>

        <div class="toolbar admin-toolbar">
          <strong id="adminCount">0 requests</strong>
          <div class="actions">
            <button id="prevPage" class="button secondary" type="button"><i data-lucide="chevron-left"></i> Prev</button>
            <span id="pageInfo" class="page-info">Page 1</span>
            <button id="nextPage" class="button secondary" type="button">Next <i data-lucide="chevron-right"></i></button>
            <button id="refreshAdmin" class="button secondary" type="button"><i data-lucide="refresh-cw"></i> Refresh</button>
          </div>
        </div>
        <div id="adminList" class="list"></div>
      </section>
    </div>
  </main>
</body>
</html>
