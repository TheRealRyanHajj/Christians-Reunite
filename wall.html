<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1210" />
  <title>Prayer Wall | Christians Reunite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="site.js" defer></script>
  <script src="wall.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><i data-lucide="cross"></i></span>
      <span>Christians Reunite</span>
    </a>
    <a class="button secondary" href="prayer.html"><i data-lucide="send"></i> Prayer</a>
  </header>

  <main class="section">
    <div class="wrap">
      <p class="kicker">Prayer Wall</p>
      <h1 class="page-title">Pray for one another.</h1>
      <p class="lead">These requests were shared with permission.</p>

      <section class="panel">
        <div class="wall-controls">
          <label class="field search-field">
            <span>Search</span>
            <input id="wallSearch" type="search" placeholder="Search public prayers" />
          </label>
          <label class="field">
            <span>Category</span>
            <select id="wallCategory">
              <option value="all">All</option>
            </select>
          </label>
          <label class="field">
            <span>Priority</span>
            <select id="wallPriority">
              <option value="all">All</option>
              <option value="urgent">Urgent</option>
              <option value="not-prayed">Not prayed for yet</option>
            </select>
          </label>
          <label class="field">
            <span>Sort</span>
            <select id="wallSort">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="not-prayed">Not prayed for yet</option>
              <option value="most-prayed">Most prayed</option>
            </select>
          </label>
        </div>

        <div class="toolbar">
          <strong id="wallCount">0 requests</strong>
          <div class="actions">
            <button id="prevWallPage" class="button secondary" type="button"><i data-lucide="chevron-left"></i> Prev</button>
            <span id="wallPageInfo" class="page-info">Page 1</span>
            <button id="nextWallPage" class="button secondary" type="button">Next <i data-lucide="chevron-right"></i></button>
            <button id="refreshWall" class="button secondary" type="button"><i data-lucide="refresh-cw"></i> Refresh</button>
          </div>
        </div>
        <div id="prayerWall" class="list"></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><i data-lucide="home"></i><span>Home</span></a>
    <a href="prayer.html"><i data-lucide="send"></i><span>Prayer</span></a>
    <a class="active" href="wall.html"><i data-lucide="heart"></i><span>Wall</span></a>
  </nav>
</body>
</html>
